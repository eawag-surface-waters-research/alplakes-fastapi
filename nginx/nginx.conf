worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Combined format + request time, upstream time and origin (GoAccess-compatible)
    log_format api '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" $request_time "$upstream_response_time" '
                   '"$http_origin"';

    # Don't log the container healthcheck (match the connecting address, which X-Forwarded-For can't spoof)
    map $realip_remote_addr $loggable {
        127.0.0.1 0;
        default   1;
    }

    access_log /var/log/nginx/access.log api if=$loggable;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 0.0.0.0/0;

    # Blocked clients: one "<ip> 1;" (or "~<regex> 1;") per line in nginx/blocklist/*.conf (gitignored, server-local)
    map $remote_addr $blocked {
        default 0;
        include /etc/nginx/blocklist/*.conf;
    }

    map $http_origin $limit_key {
        default                          $binary_remote_addr;
        "https://www.alplakes.eawag.ch"  "";
        "https://www.datalakes-eawag.ch" "";
        "https://www.datalakes.eawag.ch" "";
        "http://localhost:3000"          "";
    }

    limit_req_zone $limit_key zone=external_api:10m rate=3r/s;
    limit_req_log_level warn;

    # Max concurrent in-flight requests per client (same key as the rate limit, whitelisted origins exempt)
    limit_conn_zone $limit_key zone=external_conn:10m;
    limit_conn_log_level warn;
    # Log-only until verified: remove to start rejecting
    limit_conn_dry_run on;

    # Remote sensing timeseries only change when new satellite images arrive (at most daily)
    proxy_cache_path /var/cache/nginx/remotesensing levels=1:2 keys_zone=remotesensing:10m max_size=1g inactive=2h use_temp_path=off;

    server {
        listen 8001;

        error_page 403 = @blocked;
        if ($blocked) {
            return 403;
        }

        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @ratelimited;

        location @blocked {
            default_type application/json;
            return 403 '{"detail":"Access from your IP address has been blocked due to excessive requests that ignored rate limits (HTTP 429). Please identify your client with a descriptive User-Agent including contact details and contact james.runnalls@eawag.ch to restore access."}';
        }

        location @ratelimited {
            default_type application/json;
            return 429 '{"detail":"Rate limit exceeded. Please add more time between your requests. For details on limits or rate of updates please contact the developer. Please set a descriptive User-Agent with contact details so we can reach you."}';
        }

        limit_req zone=external_api burst=10 nodelay;
        limit_conn external_conn 4;

        proxy_http_version     1.1;
        proxy_set_header       Connection         "";
        proxy_set_header       Host               $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        proxy_read_timeout     180s;

        location / {
            proxy_pass             http://fastapi-external:8000;
        }

        location /remotesensing/timeseries/ {
            proxy_pass             http://fastapi-external:8000;
            proxy_cache            remotesensing;
            proxy_cache_valid      200 1h;
            # Collapse concurrent identical misses into one backend call
            proxy_cache_lock       on;
            proxy_cache_use_stale  error timeout updating http_502 http_503;
            add_header             X-Cache-Status     $upstream_cache_status;
            add_header             Cache-Control      "public, max-age=3600";
        }
    }
}
