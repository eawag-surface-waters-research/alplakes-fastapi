worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Combined format + request time, upstream time and origin (GoAccess-compatible)
    log_format api '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" $request_time "$upstream_response_time" '
                   '"$http_origin"';

    # Don't log the container healthcheck
    map $remote_addr $loggable {
        127.0.0.1 0;
        default   1;
    }

    access_log /var/log/nginx/access.log api if=$loggable;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 0.0.0.0/0;

    map $http_origin $limit_key {
        default                          $binary_remote_addr;
        "https://www.alplakes.eawag.ch"  "";
        "https://www.datalakes-eawag.ch" "";
        "https://www.datalakes.eawag.ch" "";
        "http://localhost:3000"          "";
    }

    limit_req_zone $limit_key zone=external_api:10m rate=3r/s;
    limit_req_log_level warn;

    # Max concurrent in-flight requests per client (same key as the rate limit, whitelisted origins exempt)
    limit_conn_zone $limit_key zone=external_conn:10m;
    limit_conn_log_level warn;
    # Log-only until verified: remove to start rejecting
    limit_conn_dry_run on;

    server {
        listen 8001;

        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @ratelimited;

        location @ratelimited {
            default_type application/json;
            return 429 '{"detail":"Rate limit exceeded. Please add more time between your requests. For details on limits or rate of updates please contact the developer."}';
        }

        location / {
            limit_req zone=external_api burst=10 nodelay;
            limit_conn external_conn 4;

            proxy_pass             http://fastapi-external:8000;
            proxy_http_version     1.1;
            proxy_set_header       Connection         "";
            proxy_set_header       Host               $host;
            proxy_set_header       X-Real-IP          $remote_addr;
            proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto  $scheme;
            proxy_read_timeout     180s;
        }
    }
}
